services:
  gatewaySvc:
    image: micro-services-gatewaysvc
    build:
      context: ./gatewaySvc
      dockerfile: Dockerfile
    container_name: gatewaySvc
    ports:
      - "8080:8080" # expose HTTP gateway to host
    depends_on:
      - persistenceSvc
    environment:
      PERSISTENCE_HTTP_URL: http://persistenceSvc:9000
      EXTERNAL_JWT_SECRET: ${EXTERNAL_JWT_SECRET:?set EXTERNAL_JWT_SECRET}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?set INTERNAL_IDENTITY_SECRET}
    networks:
      - backend

  persistenceSvc:
    image: micro-services-persistencesvc
    build:
      context: ./persistenceSvc
      dockerfile: Dockerfile
    container_name: persistenceSvc
    # gRPC port (internal; not exposed to host unless you need it)
    expose:
      - "9000"
    environment:
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?set INTERNAL_IDENTITY_SECRET}
      MONGO_URI: ${MONGO_URI}
    networks:
      - backend

networks:
  backend:
    driver: bridge
